<div class="user-list-container">
  <div class="user-list-header">
    <h2>User Management</h2>
    <button mat-flat-button color="primary" (click)="openCreateDialog()">
      <mat-icon>add</mat-icon> New User
    </button>
  </div>

  <mat-form-field appearance="outline" class="filter-field">
    <mat-label>Search users</mat-label>
    <input
      matInput
      (input)="applyFilter($event)"
      placeholder="Filter by name, email..."
      #filterInput
    >
    <mat-icon matSuffix>search</mat-icon>
  </mat-form-field>

  @if (loading) {
    <div class="loading-container">
      <p>Loading users...</p>
    </div>
  }

  <div class="table-wrapper">
    <table mat-table [dataSource]="dataSource" matSort class="user-table">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
        <td mat-cell *matCellDef="let user">{{ user.firstName }} {{ user.lastName }}</td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Email</th>
        <td mat-cell *matCellDef="let user">{{ user.email }}</td>
      </ng-container>

      <ng-container matColumnDef="role">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Role</th>
        <td mat-cell *matCellDef="let user">
          <mat-chip [style.background-color]="user.role | roleBadgeColor" style="color: white;">
            {{ user.role }}
          </mat-chip>
        </td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
        <td mat-cell *matCellDef="let user">
          <span class="status-dot" [class.active]="user.status === 'active'"
                [class.inactive]="user.status === 'inactive'">
          </span>
          {{ user.status | statusLabel }}
        </td>
      </ng-container>

      <ng-container matColumnDef="department">
        <th mat-header-cell *matHeaderCellDef mat-sort-header>Department</th>
        <td mat-cell *matCellDef="let user">{{ user.department }}</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Actions</th>
        <td mat-cell *matCellDef="let user">
          <button mat-icon-button (click)="viewUser(user)">
            <mat-icon>visibility</mat-icon>
          </button>
          <button mat-icon-button (click)="openEditDialog(user)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" (click)="deleteUser(user)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>

  <mat-paginator [pageSizeOptions]="[10, 25, 50]"
                 [pageSize]="5"
                 showFirstLastButtons>
  </mat-paginator>
</div>
